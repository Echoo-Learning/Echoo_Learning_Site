":18486,"s":"When crowded sidewalks serve competing users, planners must balance safety and access with considerable finesse to prevent conflict.","w":"finesse","k":4,"ms":104,"pos":"noun"},{"n":18381,"s":"Wise capital allocation and skillful negotiations demonstrate entrepreneurs' high degree of expertise, or considerable commercial prowess, abroad.","w":"prowess","k":4,"ms":130,"pos":"noun"},{"n":18521,"s":"Textbooks on personal development explain that enduring severe hardship often demands fortitude and emotional resilience.","w":"fortitude","k":5,"ms":86,"pos":"noun"}]},{"num":98,"difficulty":"super_hard","det":"DET 150–160","qs":[{"n":18461,"s":"The enormity of abandoning the injured cub became clear, despite the keeper's strangely casual first response.","w":"enormity","k":5,"ms":4,"pos":"noun"},{"n":18496,"s":"I welcomed responsible reporting, but the intrusion into my private messages felt invasive, not respectful of personal boundaries.","w":"intrusion","k":5,"ms":42,"pos":"noun"},{"n":18371,"s":"Unlike prolonged bureaucratic indecision, managerial acumen enabled the director to allocate emergency funds before contamination spread.","w":"acumen","k":3,"ms":53,"pos":"noun"},{"n":18391,"s":"Officials said excessively punitive grading revealed the new policy's harshness toward already struggling students nationwide.","w":"harshness","k":5,"ms":70,"pos":"noun"},{"n":18336,"s":"Mangroves underpin the island's shoreline, so the village remained protected when powerful storms arrived.","w":"underpin","k":5,"ms":10,"pos":"verb"},{"n":18651,"s":"Digital archive visits grew exponentially, doubling each month after sealed records became public.","w":"exponentially","k":8,"ms":28,"pos":"adverb"},{"n":18426,"s":"A new exhibition explores how amateur photographers capture the radiance of city lights after summer rainfall.","w":"radiance","k":5,"ms":64,"pos":"noun"},{"n":18396,"s":"The forecast's bleakness worries me, since it predicts shrinking wages, job losses, and prolonged recession.","w":"bleakness","k":5,"ms":15,"pos":"noun"},{"n":18271,"s":"Residents watched benefits accrue, rather than vanish, as the restored wetland matured over several decades.","w":"accrue","k":3,"ms":27,"pos":"verb"},{"n":18501,"s":"Researchers traced trust and communication through reciprocal influence, highlighting the interplay between partners.","w":"interplay","k":5,"ms":90,"pos":"noun"}]},{"num":99,"difficulty":"super_hard","det":"DET 150–160","qs":[{"n":18366,"s":"The museum's allure, its subtle power to charm visitors, shaped my deeply personal response to art.","w":"allure","k":3,"ms":13,"pos":"noun"},{"n":18311,"s":"Because she purchased the approved anxiety workbook herself, researchers would reimburse her for the expense.","w":"reimburse","k":5,"ms":79,"pos":"verb"},{"n":18631,"s":"Several parents in attendance vehemently opposed eliminating art classes, citing their importance for student creativity.","w":"vehemently","k":6,"ms":30,"pos":"adverb"},{"n":18516,"s":"A financial wellness report says embracing frugality helped young workers build emergency savings and reduce unnecessary stress.","w":"frugality","k":5,"ms":43,"pos":"noun"},{"n":18406,"s":"Although the rehabilitation ward remained orderly, patients described the diagnosis as a profound upheaval rather than reassurance.","w":"upheaval","k":5,"ms":98,"pos":"noun"},{"n":18306,"s":"Delays exacerbate his infection, causing swelling and pain to intensify throughout the night.","w":"exacerbate","k":6,"ms":7,"pos":"verb"},{"n":18621,"s":"The researcher gazed pensively at the robot before revising its algorithm.","w":"pensively","k":5,"ms":21,"pos":"adverb"},{"n":18626,"s":"During our discussion, you explained that reflective journaling had immeasurably strengthened your resilience during prolonged uncertainty.","w":"immeasurably","k":7,"ms":68,"pos":"adverb"},{"n":18666,"s":"My rescued fox avoided visitors and remained indoors, ostensibly recovering, so its nighttime escapes surprised me y was not merely an economic tale; its symbols criticized greed.","w":"allegory","k":5,"ms":19,"pos":"noun"}]},{"num":101,"difficulty":"super_hard","det":"DET 150–160","qs":[{"n":18526,"s":"While officials renovated urban highways, the worsening disrepair of rural bridges continued to hinder regional travel daily.","w":"disrepair","k":5,"ms":56,"pos":"noun"},{"n":18696,"s":"We need pragmatic solutions grounded in evidence rather than idealistic promises.","w":"pragmatic","k":5,"ms":8,"pos":"adjective"},{"n":18596,"s":"The committee praised your volunteer counseling and will present its highest professional accolade tomorrow morning.","w":"accolade","k":5,"ms":90,"pos":"noun"},{"n":18491,"s":"Though villagers first welcomed every newcomer, ostracism followed when elders barred one family from all communal ceremonies.","w":"ostracism","k":5,"ms":48,"pos":"noun"},{"n":18416,"s":"I initially feared the shelf was fragile, but added supports provided reassuring solidity beneath my books.","w":"solidity","k":5,"ms":81,"pos":"noun"},{"n":18376,"s":"I think synergy between our methods yielded results that neither approach could have produced on its own.","w":"synergy","k":4,"ms":8,"pos":"noun"},{"n":18346,"s":"My detailed travel journal records how stranded passengers felt compelled to reproach the negligent operator.","w":"reproach","k":5,"ms":77,"pos":"verb"},{"n":18281,"s":"Villagers enshrine their ancestral map through annual ceremonies, ensuring its routes remain protected and honored for generations ahead.","w":"enshrine","k":5,"ms":10,"pos":"verb"},{"n":18511,"s":"In landscape photography, immensity describes the vastness of scenes that appear to stretch beyond every visible boundary.","w":"immensity","k":5,"ms":26,"pos":"noun"},{"n":18351,"s":"Ideas permeate empires, never staying contained.","w":"permeate","k":5,"ms":6,"pos":"verb"}]}];
const $=id=>document.getElementById(id);
const LV={super_easy:"Super Easy",easy:"Easy",medium:"Medium",hard:"Hard",super_hard:"Super Hard"};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let cur,ans={},idx=0,left=20,tid=null,done=false,started=false,deadline=0,mode="timed";
const Q=()=>cur.qs[idx];
const pre=q=>q.w.slice(0,q.w.length-q.k);
const typed=i=>(ans[i]||"").padEnd(cur.qs[i].k," ");
const isOk=i=>typed(i).toLowerCase()===cur.qs[i].w.slice(cur.qs[i].w.length-cur.qs[i].k).toLowerCase();

function init(){
  SETS.forEach((s,i)=>{const o=document.createElement("option");o.value=i;
    o.textContent="第 "+s.num+" 套  "+LV[s.difficulty]+"  ("+s.qs.length+" 题)";$("pick").appendChild(o)});
  $("pick").onchange=()=>load($("pick").value);
  $("mode").onchange=()=>{mode=$("mode").value;if(!started)draw()};
  load(0);
}
function load(i){
  cur=SETS[i];$("pick").value=i;ans={};idx=0;done=false;started=false;clearInterval(tid);
  mode=$("mode").value;$("mode").disabled=false;
  $("diff").textContent=LV[cur.difficulty]+" · "+cur.det;$("diff").className="pill "+cur.difficulty;
  draw();
}
function prog(){return '<div class="prog">'+cur.qs.map((_,i)=>'<i class="'+(done||i<idx?"d":i===idx&&started?"c":"")+'"></i>').join("")+'</div>'}
function draw(){
  const box=$("stage");
  if(done)return review();
  if(!started){
    $("timer").textContent="";
    box.innerHTML='<div class="big">第 '+cur.num+' 套 · '+cur.qs.length+' 道题 · '+LV[cur.difficulty]+'（'+cur.det+'）</div>'+
      '<p style="color:#6b7280">'+(mode==="timed"?"每题限时 20 秒，倒计时结束自动进入下一题；最后一题结束后自动交卷。":"不计时模式：自己控制节奏，点「下一题」前可随意修改。")+'做完不能回头。</p>'+
      '<div class="row"><button class="pri" id="go">开始</button></div>';
    $("go").onclick=start;return;
  }
  const q=Q(),a=(ans[idx]||"");
  const miss=q.k,pf=pre(q);let h="";
  for(let j=0;j<miss;j++)h+='<input maxlength="1" autocomplete="off" autocapitalize="off" spellcheck="false" data-j="'+j+'" value="'+esc((a[j]||"").trim())+'">';
  box.innerHTML=prog()+'<div class="qn">第 '+(idx+1)+' / '+cur.qs.length+' 题</div>'+
    '<div id="sent">'+esc(q.s.slice(0,q.ms))+'<span class="w"><b>'+esc(pf)+'</b>'+h+'</span>'+esc(q.s.slice(q.ms+q.w.length))+'</div>'+
    '<div class="row"><button class="pri" id="nx">'+(idx===cur.qs.length-1?"交卷":"下一题")+'</button><span style="color:#9ca3af;font-size:13px">也可以按 Enter</span></div>';
  const ins=[...box.querySelectorAll("input")];
  ins.forEach((x,j)=>{
    x.oninput=()=>{x.value=x.value.replace(/[^A-Za-z]/g,"").slice(-1);setLetter(idx,j,x.value,miss);if(x.value&&ins[j+1])ins[j+1].focus()};
    x.onkeydown=e=>{if(e.key==="Backspace"&&!x.value&&ins[j-1]){ins[j-1].focus();ins[j-1].value="";setLetter(idx,j-1,"",miss);e.preventDefault()}
      else if(e.key==="ArrowLeft"&&ins[j-1])ins[j-1].focus();else if(e.key==="ArrowRight"&&ins[j+1])ins[j+1].focus();
      else if(e.key==="Enter"){e.preventDefault();next()}};
    x.onfocus=()=>x.select();
  });
  $("nx").onclick=next;
  const firstEmpty=ins.find(x=>!x.value)||ins[0];firstEmpty&&firstEmpty.focus();
}
function setLetter(i,j,v,miss){
  const a=(ans[i]||"").padEnd(miss," ").split("");a[j]=v||" ";
  const s=a.join("").replace(/\s+$/,"");
  if(s.trim())ans[i]=s;else delete ans[i];
}
function start(){
  started=true;idx=0;$("mode").disabled=true;beginQ(20);draw();
  tid=setInterval(tick,250);
}
function beginQ(sec){left=sec;deadline=Date.now()+sec*1000;}
function tick(){
  if(done||!started)return;
  if(mode==="untimed"){$("timer").textContent="不计时";return}
  left=Math.max(0,Math.ceil((deadline-Date.now())/1000));
  $("timer").textContent="00:"+String(left).padStart(2,"0");$("timer").className=left<=5?"warn":"";
  if(left<=0)next();
}
function next(){
  if(done||!started)return;
  if(idx>=cur.qs.length-1){grade();return}
  idx++;beginQ(20);draw();
}
function viewLine(i){const q=cur.qs[i];const t=typed(i).split("").map(c=>c===" "?"_":c).join("");
  return q.s.slice(0,q.ms)+pre(q)+t+q.s.slice(q.ms+q.w.length)}
function grade(){
  if(done)return;done=true;clearInterval(tid);$("timer").textContent="";
  review();
}
function review(){
  let ok=0;const rows=cur.qs.map((q,i)=>{
    const good=isOk(i);if(good)ok++;
    const t=typed(i).replace(/ /g,"_"),key=q.w.slice(q.w.length-q.k);
    const shown=good?'<span class="ok">'+esc(pre(q)+t)+'</span>':'<span class="bad">'+esc(pre(q)+t)+'</span> <span class="fix">'+esc(q.w)+'</span>';
    return '<div class="rv"><span class="no">'+(i+1)+'</span>'+esc(q.s.slice(0,q.ms))+shown+esc(q.s.slice(q.ms+q.w.length))+'</div>'});
  $("stage").innerHTML='<div id="result"><div class="res">得分：'+ok+' / '+cur.qs.length+'（'+Math.round(ok/cur.qs.length*100)+'%）</div></div>'+
    '<div class="row" style="margin:0 0 10px"><button id="retry" class="pri">重做本套</button></div>'+rows.join("");
  $("retry").onclick=()=>load($("pick").value);
  $("mode").disabled=false;
}
function restore(a,i,sec,m){   // 断点续做（云同步适配器调用）
  ans=a;idx=i;mode=m||"timed";$("mode").value=mode;$("mode").disabled=true;started=true;done=false;
  clearInterval(tid);beginQ(sec>0?sec:20);draw();tid=setInterval(tick,250);
}
init();
</script>

/* ================= 云同步公共模块（由 build.mjs 注入学生页） =================
 * 依赖：适配器在本文件之后定义 window.SYNC_ADAPTER：

 */
const SB = (() => {
  const URL = 'https://br-hip-mole-120d4f76.supabase.aidap-global.cn-beijing.volces.com';
  const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1wbGF0Zm9ybSIsInJvbGUiOiJhbm9uIiwiZXhwIjozNjg5MzA2NDQxfQ.d61XnlrSWM015kQJaJwllNc8qSpUTLNR9reQW99a644';
  const H = { apikey: KEY, Authorization: 'Bearer ' + KEY, 'Content-Type': 'application/json' };

  async function api(path, opt = {}) {
    const r = await fetch(URL + '/rest/v1/' + path, Object.assign({}, opt, { headers: Object.assign({}, H, opt.headers || {}) }));
    if (!r.ok) throw new Error(r.status + ' ' + (await r.text()).slice(0, 200));
    const t = await r.text();
    return t ? JSON.parse(t) : null;
  }
  // 学生页只能调用数据库函数（见 sql/02-收紧权限.sql），不能直接读写表
  const rpc = (fn, args, opt = {}) => api('rpc/' + fn, Object.assign({ method: 'POST', body: JSON.stringify(args) }, opt));

  function uuid() {

    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
      const r = Math.random() * 16 | 0;
      return (c === 'x' ? r : (r & 3 | 8)).toString(16);
    });

  /* ---------- 状态角标 ---------- */
  const css = `
  #sb-badge{position:fixed;left:12px;bottom:12px;z-index:9999;font:12.5px/1.4 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    padding:5px 11px;border-radius:99px;background:#f3f4f6;color:#4b5563;border:1px solid #e5e7eb;box-shadow:0 1px 4px rgba(0,0,0,.06)}
  #sb-badge.ok{background:#ecfdf5;color:#047857;border-color:#a7f3d0}

  #sb-tip{position:absolute;z-index:10000;display:none;font:13px/1 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;

  #sb-tip:hover{background:#1f2937}
  #sb-bookbtn{position:fixed;right:12px;bottom:12px;z-index:9999;font:13px/1.4 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    padding:7px 13px;border-radius:99px;border:1px solid #fcd34d;background:#fffbeb;color:#92400e;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.08)}
  #sb-book{position:fixed;right:12px;bottom:56px;z-index:9999;width:min(340px,calc(100vw - 24px));max-height:60vh;overflow:auto;display:none;
    background:#fff;border:1px solid #e5e7eb;border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.14);padding:12px;
    font:13.5px/1.5 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;color:#1f2937}
  #sb-book h4{margin:0 0 4px;font-size:14px}
  #sb-book .hint{color:#6b7280;font-size:12px;margin-bottom:8px}
  #sb-book .it{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-top:1px solid #f3f4f6}
  #sb-book .it b{color:#92400e}
  #sb-book .it .cx{color:#6b7280;font-size:12px}
  #sb-book .it button{margin-left:auto;border:0;background:none;color:#9ca3af;cursor:pointer;font-size:15px;padding:0 2px}
  #sb-book .it button:hover{color:#dc2626}
  .sbv{background:#fef3c7;border-bottom:2px solid #f59e0b;border-radius:2px}
  #sb-toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:10001;background:#111827;color:#fff;
    padding:8px 14px;border-radius:8px;font:13.5px -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;display:none}
  `;
  const st = document.createElement('style');
  st.textContent = css;
  document.head.appendChild(st);

  const badge = document.createElement('div');
  badge.id = 'sb-badge';
  badge.dataset.novocab = '1';
  document.body.appendChild(badge);
  function setBadge(kind, text) { badge.className = kind; badge.textContent = text; }

  const toastEl = document.createElement('div');
  toastEl.id = 'sb-toast';
  document.body.appendChild(toastEl);
  function toast(msg) {
    toastEl.textContent = msg; toastEl.style.display = 'block';
    clearTimeout(toast._h); toast._h = setTimeout(() => toastEl.style.display = 'none', 2200);
  }
  const hhmm = () => new Date().toTimeString().slice(0, 5);

  /* ---------- 作答保存（同一次作答一行，反复覆盖） ---------- */
  let pending = null, inflight = false;
  async function flush() {
    if (inflight || !pending) return;
    const { row, keepalive } = pending;
    pending = null; inflight = true;
    setBadge('busy', '☁ 保存中…');
    try {
      await rpc('student_save', { p: row }, { keepalive });
      setBadge('ok', row.status === 'submitted' ? '✅ 已交卷，老师已收到 ' + hhmm() : '☁ 已自动保存 ' + hhmm());
      if (row.status === 'submitted') saveSubmission.lastOk = row.id;
    } catch (e) {
      console.warn('[sync]', e);
      setBadge('err', '⚠ 保存失败，正在重试…（请检查网络）');
      if (!pending) pending = { row, keepalive };   // 失败的留着重试，除非已有更新的
      setTimeout(flush, 5000);
    } finally {
      inflight = false;
      if (pending) setTimeout(flush, 300);
    }
  }
  function saveSubmission(row, { now = false } = {}) {
    row = Object.assign({ task_type: A().task, updated_at: new Date().toISOString() }, row);
    pending = { row, keepalive: now };
    if (now) flush();
    else { clearTimeout(saveSubmission._t); saveSubmission._t = setTimeout(flush, 1500); }
  }
  async function findInProgress(name, setNum) {
    const rows = await rpc('student_find', { p_name: name, p_task: A().task, p_set: setNum });
    return rows && rows[0];
  }
  async function markAbandoned(id) {
    await rpc('student_abandon', { p_id: id, p_name: A().getName() });
  }

  /* ---------- 生词本 ---------- */
  const A = () => window.SYNC_ADAPTER;
  let vocab = [];            // 当前学生的生词行
  let vocabOwner = null;

  const tip = document.createElement('button');
  tip.id = 'sb-tip';
  tip.textContent = '📌 标为生词';
  tip.dataset.novocab = '1';
  document.body.appendChild(tip);

  const bookBtn = document.createElement('button');
  bookBtn.id = 'sb-bookbtn';
  bookBtn.dataset.novocab = '1';
  document.body.appendChild(bookBtn);
  const book = document.createElement('div');
  book.id = 'sb-book';
  book.dataset.novocab = '1';
  document.body.appendChild(book);
  bookBtn.onclick = () => { book.style.display = book.style.display === 'block' ? 'none' : 'block'; renderBook(); };

  function renderBook() {
    bookBtn.textContent = '📒 我的生词本 (' + vocab.length + ')';
    if (book.style.display !== 'block') return;
    const esc = s => String(s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    book.innerHTML = `<h4>📒 我的生词本</h4><div class="hint">用鼠标选中文章里不认识的词 → 点「📌 标为生词」，老师那边会同步收到。</div>` +
      (vocab.length ? vocab.map(v => `<div class="it"><div><b>${esc(v.word)}</b> <span class="cx">· ${esc(v.task_type)} #${esc(v.set_num)}</span>` +
        (v.context ? `<div class="cx">${esc(v.context.length > 90 ? v.context.slice(0, 90) + '…' : v.context)}</div>` : '') +
        `</div><button title="删除" data-id="${esc(v.id)}">×</button></div>`).join('')
        : '<div class="cx">还没有标记生词</div>');
    book.querySelectorAll('button[data-id]').forEach(b => b.onclick = () => removeWord(b.dataset.id));
  }

  async function loadVocab(force) {
    const name = A().getName();
    if (!name) { vocab = []; vocabOwner = null; renderBook(); highlight(); return; }
    if (!force && name === vocabOwner) return;
    vocabOwner = name;
    try {
      vocab = await rpc('vocab_list', { p_name: name }) || [];
    } catch (e) { console.warn('[vocab]', e); }
    renderBook(); highlight();
  }

  function ensureName() {
    let n = A().getName();
    if (n) return n;
    n = (prompt('请先输入你的名字（老师靠它认出你）') || '').trim();
    if (n) A().setName(n);
    return n;
  }

  function sentenceAround(text, word) {
    if (!text) return '';
    const sents = text.replace(/\s+/g, ' ').match(/[^.!?。！？]+[.!?。！？]*["”’)]*/g) || [text];
    const re = new RegExp('\\b' + word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'i');
    const s = sents.find(x => re.test(x)) || '';
    return s.trim().slice(0, 400);
  }

  async function addWord(word, node) {
    const name = ensureName();
    if (!name) { toast('没有名字，生词没法保存'); return; }
    if (vocabOwner !== name) await loadVocab(true);
    if (vocab.some(v => v.word.toLowerCase() === word.toLowerCase())) { toast('「' + word + '」已经在生词本里了'); return; }
    let ctx = '';
    try { ctx = (A().contextFor && A().contextFor(word, node)) || ''; } catch (e) {}
    if (!ctx) {
      const blk = node && (node.nodeType === 1 ? node : node.parentElement);
      const box = blk && blk.closest('p,div,li,td');
      ctx = sentenceAround(box ? box.textContent : '', word);
    }
    const row = { id: uuid(), student_name: name, task_type: A().task, set_num: A().setNum(), word, context: ctx };
    vocab.unshift(Object.assign({ created_at: new Date().toISOString() }, row));
    renderBook(); highlight();
    toast('已加入生词本：' + word);
    try {
      await rpc('vocab_add', { p: row });
    } catch (e) {
      console.warn('[vocab]', e);
      vocab = vocab.filter(v => v.id !== row.id);
      renderBook(); highlight();
      toast('⚠ 生词保存失败，请检查网络后重试');
    }
  }

  async function removeWord(id) {
    const old = vocab;
    vocab = vocab.filter(v => v.id !== id);
    renderBook(); highlight();
    try { await rpc('vocab_remove', { p_id: id, p_name: vocabOwner }); }
    catch (e) { vocab = old; renderBook(); highlight(); toast('⚠ 删除失败，请检查网络'); }
  }

  /* 选中文字 → 浮出按钮 */
  let selWord = '', selNode = null, snap = null;
  const SKIP = 'input,textarea,select,option,button,[data-novocab]';
  document.addEventListener('mousedown', e => {
    if (tip.contains(e.target)) return;
    tip.style.display = 'none';
    try { snap = A().snapshot ? A().snapshot() : null; } catch (err) { snap = null; }
  }, true);
  function onSelEnd(e) {
    if (e && tip.contains(e.target)) return;
    setTimeout(() => {
      const sel = window.getSelection();
      const raw = sel ? sel.toString() : '';
      const w = raw.replace(/\s+/g, ' ').trim().replace(/^[^A-Za-z]+|[^A-Za-z]+$/g, '');
      if (!sel || sel.isCollapsed || !w || w.length > 40 || w.split(' ').length > 4 || !/[A-Za-z]/.test(w)) { tip.style.display = 'none'; return; }
      const range = sel.getRangeAt(0);
      const anc = range.commonAncestorContainer;
      const el = anc.nodeType === 1 ? anc : anc.parentElement;
      const root = document.querySelector(A().hlRoot);
      if (!el || !root || !root.contains(el) || el.closest(SKIP)) { tip.style.display = 'none'; return; }
      selWord = w; selNode = anc;
      const rect = range.getBoundingClientRect();
      tip.textContent = A().snapshot ? '📌 标为生词（不影响你的答案）' : '📌 标为生词';
      tip.style.display = 'block';
      tip.style.left = Math.max(8, window.scrollX + rect.left + rect.width / 2 - tip.offsetWidth / 2) + 'px';
      tip.style.top = (window.scrollY + rect.top - tip.offsetHeight - 8) + 'px';
    }, 0);
  }
  document.addEventListener('mouseup', onSelEnd);
  document.addEventListener('touchend', onSelEnd);
  tip.addEventListener('mousedown', e => e.preventDefault());
  tip.addEventListener('click', () => {
    tip.style.display = 'none';
    if (snap && A().restore) { try { A().restore(snap); } catch (e) {} }
    const w = selWord, n = selNode;
    window.getSelection().removeAllRanges();
    if (w) addWord(w, n);
  });

  /* 生词高亮：只改动需要改动的文本节点，避免打断学生的选区 */
  let hlBusy = false;
  function highlight() {
    const root = document.querySelector(A().hlRoot);
    if (!root || hlBusy) return;
    hlBusy = true;
    try {
      const set = new Set(vocab.map(v => v.word.toLowerCase()));
      let unwrapped = false;
      root.querySelectorAll('span.sbv').forEach(s => {
        if (!set.has(s.dataset.w)) { s.replaceWith(document.createTextNode(s.textContent)); unwrapped = true; }
      });
      if (unwrapped) root.normalize();
      if (!set.size) return;
      const words = [...set].sort((a, b) => b.length - a.length).map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/ /g, '\\s+'));
      const re = new RegExp('\\b(' + words.join('|') + ')\\b', 'gi');
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
        acceptNode: n => (n.parentElement.closest(SKIP + ',span.sbv,script,style') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT)
      });
      const nodes = [];
      while (walker.nextNode()) { re.lastIndex = 0; if (re.test(walker.currentNode.nodeValue)) nodes.push(walker.currentNode); }
      nodes.forEach(n => {
        const frag = document.createDocumentFragment();
        const s = n.nodeValue;
        let last = 0;
        re.lastIndex = 0;
        for (let m; (m = re.exec(s));) {
          if (m.index > last) frag.appendChild(document.createTextNode(s.slice(last, m.index)));
          const sp = document.createElement('span');
          sp.className = 'sbv';
          sp.dataset.w = m[0].toLowerCase().replace(/\s+/g, ' ');
          sp.textContent = m[0];
          frag.appendChild(sp);
          last = m.index + m[0].length;
        }
        if (last < s.length) frag.appendChild(document.createTextNode(s.slice(last)));
        n.replaceWith(frag);
      });
    } finally {
      mo.takeRecords();
      hlBusy = false;
    }
  }
  const mo = new MutationObserver(() => { clearTimeout(highlight._t); highlight._t = setTimeout(highlight, 120); });

  function start() {
    const root = document.querySelector(A().hlRoot);
    if (root) mo.observe(root, { childList: true, subtree: true, characterData: true });
    if (!A().getName()) setBadge('', '☁ 填写名字后开始自动保存');
    else setBadge('', '☁ 云同步已就绪');
    loadVocab(true);
  }

  return { api, uuid, saveSubmission, findInProgress, markAbandoned, loadVocab, setBadge, toast, start };
})();

/* ================= Fill in the Blanks 适配器 =================
 * 依赖原页面的全局变量：cur, ans, idx, left, done, started, mode, SETS
 * 以及函数：load, draw, grade, restore, viewLine, isOk, typed, pre
 * answers = { fills: {题序(0起): 已填字母}, text: 逐题带填写的文本（老师后台实时显示用）, filled, total, idx, mode, difficulty }
 * 一次作答 = 一套（约 10 题）；set_num = 套号；si = 当前做到第几题（0 起）
 */
(() => {
  const NAME_KEY = 'sb_student_name';
  const who = $('who');
  let sid = SB.uuid();
  let lastSig = '', lastBeat = 0;
  try { who.value = localStorage.getItem(NAME_KEY) || ''; } catch (e) {}

  const filledCount = () => cur.qs.filter((q, i) => (ans[i] || '').trim()).length;
  function viewText() {
    return cur.qs.map((q, i) => `${i + 1}. ${viewLine(i)}`).join('\n');
  }

  window.SYNC_ADAPTER = {
    task: 'FB',
    hlRoot: '#stage',
    getName: () => who.value.trim(),
    setName: n => { who.value = n; onName(); },
    setNum: () => cur.num
  };

  function row(status) {
    return {
      id: sid, student_name: who.value.trim(), set_num: cur.num, si: idx, status,
      answers: { fills: ans, text: viewText(), filled: filledCount(), total: cur.qs.length, idx, mode, difficulty: cur.difficulty },
      left_seconds: Math.max(left, 0), time_used_seconds: 0
    };
  }
  function autosave() {
    if (done || !started || !who.value.trim()) return;
    const sig = JSON.stringify([cur.num, ans, idx, who.value.trim()]);
    const now = Date.now();
    if (sig !== lastSig || now - lastBeat > 20000) {
      lastSig = sig; lastBeat = now;
      SB.saveSubmission(row('in_progress'));
    }
  }
  setInterval(autosave, 1500);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && !done && started && who.value.trim() && lastSig) SB.saveSubmission(row('in_progress'), { now: true });
  });

  /* ---------- 断点续做 ---------- */
  async function tryRestore() {
    const name = who.value.trim();
    if (!name || done || started) return;
    const num = cur.num;
    let r;
    try { r = await SB.findInProgress(name, num); } catch (e) { console.warn(e); return; }
    if (!r || r.id === sid || cur.num !== num || done || started) return;
    if (Date.now() - new Date(r.updated_at).getTime() > 7 * 86400e3) return;
    const a = r.answers || {};
    const i = Math.min(Math.max(r.si || 0, 0), cur.qs.length - 1);
    if (confirm(`检测到你上次做第 ${num} 套还没交卷（做到第 ${i + 1}/${cur.qs.length} 题）。\n\n要接着上次继续做吗？\n（选「取消」则重新开始）`)) {
      sid = r.id;
      lastSig = '';
      restore(Object.assign({}, a.fills || {}), i, r.left_seconds || 20, a.mode);
      SB.toast('已恢复上次的作答');
    } else {
      SB.markAbandoned(r.id).catch(() => {});
    }
  }
  function onName() {
    const n = who.value.trim();
    try { localStorage.setItem(NAME_KEY, n); } catch (e) {}
    SB.loadVocab();
    if (n) SB.setBadge('', '☁ 云同步已就绪');
    tryRestore();
  }
  who.addEventListener('change', onName);
  who.addEventListener('keydown', e => { if (e.key === 'Enter') who.blur(); });

  /* ---------- 换套：新的一次作答 ---------- */
  const origLoad = load;
  load = function (i) {
    if (!done && started && lastSig && who.value.trim()) SB.saveSubmission(row('in_progress'), { now: true });
    origLoad(i);
    sid = SB.uuid(); lastSig = ''; lastBeat = 0;
    tryRestore();
  };

  /* ---------- 交卷：上传逐题对错 ---------- */
  function items() {
    return cur.qs.map((q, i) => {
      const stuLetters = typed(i);
      const has = (ans[i] || '').trim();
      return {
        sec: '补全单词',
        q: `#${q.n} ${q.s.slice(0, q.ms)}${pre(q)}${'_'.repeat(q.k)}${q.s.slice(q.ms + q.w.length)}`,
        stu: has ? pre(q) + stuLetters.replace(/ /g, '_') : '',
        key: q.w,
        ok: isOk(i)
      };
    });
  }
  const origGrade = grade;
  grade = function () {
    if (done) return;
    if (!who.value.trim()) {
      const n = (prompt('交卷前请输入你的姓名缩写（老师靠它认出你）') || '').trim();
      if (n) { who.value = n; try { localStorage.setItem(NAME_KEY, n); } catch (e) {} }
    }
    const its = items();                       // 先取答案再进入「已交卷」状态
    origGrade();
    const r = row('submitted');
    r.si = cur.qs.length - 1;
    r.grading = { items: its, difficulty: cur.difficulty };
    r.score = its.filter(x => x.ok).length;
    r.total = its.length;
    if (r.student_name) {
      SB.saveSubmission(r, { now: true });
      $('result').insertAdjacentHTML('beforeend', '<div class="res">✅ 作答已自动发送给老师，不用再手动发送。</div>');
    } else {
      $('result').insertAdjacentHTML('beforeend', '<div class="todo">⚠ 没有填写名字，作答没有发送给老师。</div>');
    }
  };

  /* ---------- 开始前确认名字 ---------- */
  const origStart = start;
  start = function () {
    if (!who.value.trim()) {
      const n = (prompt('开始前请输入你的姓名缩写（例如 HQ），老师靠它认出你') || '').trim();
      if (n) { who.value = n; onName(); }
    }
    origStart();
  };

  SB.start();
  if (who.value.trim()) onName();

  // 直达链接：页面地址末尾 #12 → 直接打开第 12 套
  function openFromHash() {
    const n = Number(location.hash.slice(1));
    const i = SETS.findIndex(s => s.num === n);
    if (i >= 0 && cur.num !== n) load(i);
  }
  window.addEventListener('hashchange', openFromHash);
  openFromHash();
})();

</script>
